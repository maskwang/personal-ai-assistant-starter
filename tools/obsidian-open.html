<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>在 Obsidian 中打开</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 40px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f7f7f8; color: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) { body { background:#111; color:#eee; } .card{background:#1c1c1e!important} code{background:#2c2c2e!important;color:#8ee!important} }
  .card { max-width: 520px; margin: 0 auto; background:#fff; border-radius:16px; padding:24px 20px; box-shadow:0 2px 16px rgba(0,0,0,.08); }
  h1 { font-size: 19px; margin: 0 0 6px; }
  .sub { margin: 0 0 22px; font-size: 13px; opacity: .65; word-break: break-all; }
  a.btn {
    display: block; text-align: center; text-decoration: none;
    padding: 15px 16px; border-radius: 12px; font-size: 17px; font-weight: 600;
    background: #7c3aed; color: #fff;
  }
  a.btn:active { transform: scale(.985); }
  .hint { margin: 22px 0 8px; font-size: 13px; opacity: .7; }
  code { display:block; padding: 10px 12px; border-radius: 10px; background:#f0f0f2; color:#333;
         font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; user-select: all; }
  .fallback { display:none; margin-top:16px; padding:12px 14px; border-radius:10px; background:#fff3cd; color:#664d03; font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <div id="dingtalk-banner" style="display:none;background:#fef3c7;color:#92400e;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:14px;line-height:1.5;border:1px solid #fde68a;">
    <strong>⚠️ 因钉钉安全限制：</strong><br>
    请点击右上角 <strong>「…」</strong> 按钮，选择 <strong>「在默认浏览器中打开」</strong>，即可自动唤起 Obsidian 直达笔记！
  </div>

  <h1 id="title">正在唤起 Obsidian…</h1>
  <p class="sub" id="sub"></p>
  <a class="btn" id="go" href="#">在 Obsidian 中打开</a>
  <div class="fallback" id="fallback">在外部浏览器中点击上方按钮，或点击下方按钮复制链接。</div>
  <p class="hint">备用方案：</p>
  <button id="copy-btn" style="width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #ddd;background:#f9f9fa;font-size:14px;cursor:pointer;">📋 点击一键复制深链</button>
  <code id="raw"></code>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var file = (q.get('file') || '').replace(/^\/+/, '');
  var vault = q.get('vault') || 'Vaults';
  var target = 'obsidian://open?vault=' + encodeURIComponent(vault) +
               '&file=' + encodeURIComponent(file).replace(/%2F/g, '/');

  var isDingTalk = /DingTalk/i.test(navigator.userAgent);
  var isWeChat = /MicroMessenger/i.test(navigator.userAgent);

  document.getElementById('sub').textContent = file || '（未指定笔记）';
  document.getElementById('go').href = target;
  document.getElementById('raw').textContent = target;

  // 复制按钮交互
  var copyBtn = document.getElementById('copy-btn');
  copyBtn.onclick = function() {
    navigator.clipboard.writeText(target).then(function() {
      copyBtn.textContent = '✅ 已成功复制！粘贴至 Safari 地址栏即可';
      setTimeout(function() { copyBtn.textContent = '📋 点击一键复制深链'; }, 3000);
    }).catch(function() {
      alert('请长按下方代码框手动复制');
    });
  };

  if (isDingTalk || isWeChat) {
    // 钉钉/微信内置浏览器环境：拦截了自定义协议
    document.getElementById('dingtalk-banner').style.display = 'block';
    document.getElementById('title').textContent = '请在系统浏览器中打开';
    document.getElementById('fallback').style.display = 'block';
  } else {
    // Safari / Chrome 等原生系统浏览器环境：自动无缝唤起
    var fired = false;
    function jump() {
      if (fired) return;
      fired = true;
      document.getElementById('title').textContent = '在 Obsidian 中打开';
      location.href = target;
      setTimeout(function () {
        document.getElementById('fallback').style.display = 'block';
      }, 1200);
    }
    if (file) setTimeout(jump, 250);
  }
})();
</script>
</body>
</html>
